<!doctype html>
<html lang="en">
  <head>
    <title>Admin Dashboard | Lexo Property</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <section class="admin-section">
      <h2>Add New Property</h2>

      <form id="property-form">
        <input type="text" id="title" placeholder="Property Title" required />

        <input type="number" id="price" placeholder="Price (₦)" required />

        <input type="text" id="location" placeholder="Location" required />

        <input
          type="text"
          id="type"
          placeholder="Property Type (Duplex, Apartment...)"
          required
        />

        <input type="number" id="bedrooms" placeholder="Bedrooms" required />

        <input type="number" id="bathrooms" placeholder="Bathrooms" required />

        <input
          type="text"
          id="image"
          placeholder="Image Path (e.g. images/properties/house4.jpg)"
          required
        />

        <textarea
          id="description"
          placeholder="Property Description"
          rows="5"
          required
        ></textarea>

        <button type="submit">Add Property</button>
      </form>
    </section>

    <section class="recent-properties">
      <h2>Manage Properties</h2>

      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Location</th>
            <th>Price</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="property-list">
          <!-- Properties will be loaded here dynamically -->
        </tbody>
      </table>
    </section>

    <script src="../js/admin.js"></script>
  </body>
</html>
