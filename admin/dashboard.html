<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lexo Admin Dashboard</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <section class="dashboard">
      <div class="container">
        <div class="dashboard-header">
          <div>
            <h1>Admin Dashboard</h1>
            <p>Manage all your properties from one place.</p>
          </div>

          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>

        <!-- Dashboard Cards -->

        <div class="dashboard-cards">
          <div class="dashboard-card">
            <h3>Total Properties</h3>
            <h2 id="totalProperties">0</h2>
          </div>

          <div class="dashboard-card">
            <h3>Available</h3>
            <h2 id="availableProperties">0</h2>
          </div>

          <div class="dashboard-card">
            <h3>Sold</h3>
            <h2 id="soldProperties">0</h2>
          </div>
        </div>

        <!-- Add Property -->

        <div class="recent-properties">
          <h2>Add New Property</h2>

          <form id="property-form" enctype="multipart/form-data">
            <input
              type="text"
              id="title"
              name="title"
              placeholder="Property Title"
              required
            />

            <input
              type="number"
              id="price"
              name="price"
              placeholder="Price (₦)"
              required
            />

            <input
              type="text"
              id="location"
              name="location"
              placeholder="Location"
              required
            />

            <input
              type="text"
              id="type"
              name="type"
              placeholder="Property Type"
              required
            />

            <input
              type="number"
              id="bedrooms"
              name="bedrooms"
              placeholder="Bedrooms"
              required
            />

            <input
              type="number"
              id="bathrooms"
              name="bathrooms"
              placeholder="Bathrooms"
              required
            />

            <label for="image">Property Image</label>

            <input type="file" id="image" name="image" accept="image/*" />

            <small id="image-note">
              Leave this empty if you don't want to replace the current image
              while editing.
            </small>

            <select id="status" name="status">
              <option value="Available">Available</option>
              <option value="Sold">Sold</option>
            </select>

            <!-- NEW -->

            <div class="featured-property">
              <label class="featured-label">
                <input type="checkbox" id="featured" name="featured" />

                Feature this property on the Homepage
              </label>
            </div>

            <textarea
              id="description"
              name="description"
              placeholder="Property Description"
              rows="5"
              required
            ></textarea>

            <button type="submit">Add Property</button>
          </form>
        </div>

        <!-- Manage Properties -->

        <div class="recent-properties">
          <div class="table-header">
            <h2>Manage Properties</h2>

            <div class="table-controls">
              <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search by title, location or property type..."
              />

              <select id="statusFilter">
                <option value="All">All Status</option>

                <option value="Available">Available</option>

                <option value="Sold">Sold</option>
              </select>

              <!-- NEW -->

              <select id="featuredFilter">
                <option value="All">All Properties</option>
                <option value="Featured">Featured Only</option>
                <option value="Not Featured">Not Featured</option>
              </select>

              <select id="sortFilter">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="highest">Highest Price</option>
                <option value="lowest">Lowest Price</option>
                <option value="az">A - Z</option>
                <option value="za">Z - A</option>
              </select>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Image</th>

                <th>Title</th>

                <th>Location</th>

                <th>Price</th>

                <th>Status</th>

                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="property-table-body"></tbody>
          </table>

          <div class="pagination">
            <button id="prevPage">Previous</button>

            <span id="pageInfo"> Page 1 </span>

            <button id="nextPage">Next</button>
          </div>
        </div>
      </div>
    </section>

    <script src="../js/dashboard.js"></script>
  </body>
</html>
