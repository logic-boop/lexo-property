<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lexo Admin Dashboard</title>

    <!-- Main desktop styles -->
    <link rel="stylesheet" href="../css/style.css" />

    <!-- Responsive styles -->
    <link rel="stylesheet" href="../css/responsive.css" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <section class="dashboard">
      <div class="container">
        <!-- =========================
             DASHBOARD HEADER
        ========================== -->

        <header class="dashboard-header">
          <div class="dashboard-header-content">
            <h1>Admin Dashboard</h1>

            <p>Manage all your properties from one place.</p>
          </div>

          <button type="button" id="logoutBtn" class="logout-btn">
            Logout
          </button>
        </header>

        <!-- =========================
             DASHBOARD STATISTICS
        ========================== -->

        <section class="dashboard-cards" aria-label="Property statistics">
          <div class="dashboard-card">
            <h3>Total Properties</h3>

            <h2 id="totalProperties">0</h2>
          </div>

          <div class="dashboard-card">
            <h3>Available</h3>

            <h2 id="availableProperties">0</h2>
          </div>

          <div class="dashboard-card">
            <h3>Sold</h3>

            <h2 id="soldProperties">0</h2>
          </div>
        </section>

        <!-- =========================
             ADD NEW PROPERTY
        ========================== -->

        <section class="recent-properties add-property-section">
          <div class="section-heading">
            <h2>Add New Property</h2>
          </div>

          <form id="property-form" enctype="multipart/form-data">
            <!-- Property Title -->

            <input
              type="text"
              id="title"
              name="title"
              placeholder="Property Title"
              autocomplete="off"
              required
            />

            <!-- Property Price -->

            <input
              type="number"
              id="price"
              name="price"
              placeholder="Price (₦)"
              min="0"
              required
            />

            <!-- Location -->

            <input
              type="text"
              id="location"
              name="location"
              placeholder="Location"
              autocomplete="address-level2"
              required
            />

            <!-- Property Type -->

            <input
              type="text"
              id="type"
              name="type"
              placeholder="Property Type"
              autocomplete="off"
              required
            />

            <!-- Bedrooms -->

            <input
              type="number"
              id="bedrooms"
              name="bedrooms"
              placeholder="Bedrooms"
              min="0"
              required
            />

            <!-- Bathrooms -->

            <input
              type="number"
              id="bathrooms"
              name="bathrooms"
              placeholder="Bathrooms"
              min="0"
              required
            />

            <!-- Property Image -->

            <div class="property-image-field">
              <label for="image"> Property Image </label>

              <input type="file" id="image" name="image" accept="image/*" />

              <small id="image-note">
                Leave this empty if you don't want to replace the current image
                while editing.
              </small>
            </div>

            <!-- Status -->

            <select id="status" name="status">
              <option value="Available">Available</option>

              <option value="Sold">Sold</option>
            </select>

            <!-- Featured Property -->

            <div class="featured-property">
              <label class="featured-label" for="featured">
                <input type="checkbox" id="featured" name="featured" />

                <span> Feature this property on the Homepage </span>
              </label>
            </div>

            <!-- Description -->

            <textarea
              id="description"
              name="description"
              placeholder="Property Description"
              rows="5"
              required
            ></textarea>

            <!-- Submit -->

            <button type="submit">Add Property</button>
          </form>
        </section>

        <!-- =========================
             MANAGE PROPERTIES
        ========================== -->

        <section class="recent-properties manage-properties-section">
          <!-- Table Header -->

          <div class="table-header">
            <div class="table-heading">
              <h2>Manage Properties</h2>
            </div>

            <!-- Filters -->

            <div class="table-controls">
              <!-- Search -->

              <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search by title, location or property type..."
                autocomplete="off"
              />

              <!-- Status Filter -->

              <select id="statusFilter">
                <option value="All">All Status</option>

                <option value="Available">Available</option>

                <option value="Sold">Sold</option>
              </select>

              <!-- Featured Filter -->

              <select id="featuredFilter">
                <option value="All">All Properties</option>

                <option value="Featured">Featured Only</option>

                <option value="Not Featured">Not Featured</option>
              </select>

              <!-- Sort -->

              <select id="sortFilter">
                <option value="newest">Newest First</option>

                <option value="oldest">Oldest First</option>

                <option value="highest">Highest Price</option>

                <option value="lowest">Lowest Price</option>

                <option value="az">A - Z</option>

                <option value="za">Z - A</option>
              </select>
            </div>
          </div>

          <!-- =========================
               RESPONSIVE TABLE WRAPPER
          ========================== -->

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th scope="col">Image</th>

                  <th scope="col">Title</th>

                  <th scope="col">Location</th>

                  <th scope="col">Price</th>

                  <th scope="col">Status</th>

                  <th scope="col">Actions</th>
                </tr>
              </thead>

              <tbody id="property-table-body">
                <!-- Properties are inserted by dashboard.js -->
              </tbody>
            </table>
          </div>

          <!-- =========================
               PAGINATION
          ========================== -->

          <div class="pagination" aria-label="Property pagination">
            <button type="button" id="prevPage">Previous</button>

            <span id="pageInfo"> Page 1 </span>

            <button type="button" id="nextPage">Next</button>
          </div>
        </section>
      </div>
    </section>

    <!-- Dashboard JavaScript -->
    <script src="../js/dashboard.js"></script>
  </body>
</html>
